traits: [precise, calm, direct]
trait_signals:
  precise: [exactly, deterministic, verify, evidence]
  calm: [bounded, unchanged, no-op]
  direct: [original, proposed, applied]
style:
  sentence_case_headings: true
  max_exclamation_marks: 0
  error_messages:
    forbid_prefixes: ["Error", "ERROR", "Fatal", "panic"]
    forbid_numeric_codes: true
    require_actionable: true
